[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commitverse-core"
version = "0.1.0"
description = "A custom Git-compatible version control engine."
readme = { text = "CommitVerse Core is a custom version control engine.", content-type = "text/plain" }
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Piyush Rathod" }
]
dependencies = []

[project.scripts]
cv = "commitverse_core.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
