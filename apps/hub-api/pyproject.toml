[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commitverse-hub-api"
version = "0.1.0"
description = "The CommitVerse Hub HTTP API foundation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26.0",
    "alembic>=1.13,<2.0",
    "email-validator>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0",
]

[project.scripts]
commitverse-hub = "commitverse_hub.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
