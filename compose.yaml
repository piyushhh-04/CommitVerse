name: commitverse

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${COMMITVERSE_DB_NAME:-commitverse}
      POSTGRES_USER: ${COMMITVERSE_DB_USER:-commitverse_app}
      POSTGRES_PASSWORD: ${COMMITVERSE_DB_PASSWORD:-commitverse-local-only}
    ports:
      - "${COMMITVERSE_DB_PORT:-5432}:5432"
    volumes:
      - commitverse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COMMITVERSE_DB_USER:-commitverse_app} -d ${COMMITVERSE_DB_NAME:-commitverse}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/hub-api/Dockerfile
    environment:
      HUB_DATABASE_URL: postgresql+psycopg://${COMMITVERSE_DB_USER:-commitverse_app}:${COMMITVERSE_DB_PASSWORD:-commitverse-local-only}@postgres:5432/${COMMITVERSE_DB_NAME:-commitverse}
      HUB_REPOSITORY_STORAGE_ROOT: /var/lib/commitverse/repositories
      HUB_CSRF_ALLOWED_ORIGINS: ${HUB_CSRF_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${COMMITVERSE_API_PORT:-8000}:8000"
    command: ["sh", "-lc", "alembic upgrade head && exec commitverse-hub"]
    volumes:
      - commitverse_repositories:/var/lib/commitverse/repositories
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/hub-api/Dockerfile
    command: ["commitverse-hub-worker"]
    environment:
      HUB_DATABASE_URL: postgresql+psycopg://${COMMITVERSE_DB_USER:-commitverse_app}:${COMMITVERSE_DB_PASSWORD:-commitverse-local-only}@postgres:5432/${COMMITVERSE_DB_NAME:-commitverse}
      HUB_REPOSITORY_STORAGE_ROOT: /var/lib/commitverse/repositories
    volumes:
      - commitverse_repositories:/var/lib/commitverse/repositories
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  commitverse_postgres:
  commitverse_repositories:
